name: nexus_link
description: Nexus link management app (Optimized & Fast).
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/nexus_icon.png"
  adaptive_icon_background: "#1E212D"
  adaptive_icon_foreground: "assets/nexus_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/nexus_icon.png
