name: Build HyperLink APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Old React Native Files & Initialize App Structure
        run: |
          # 1. پاک کردن ردپاهای پروژه ری‌اکت نیتیو قبلی تا فلاتر بتواند هسته خودش را بسازد
          rm -rf android ios web macos windows linux
          
          # 2. ساخت هسته بکر و تمیز فلاتر
          flutter create --project-name hyperlink --org com.hyperlink.app .
          
          # 3. ارتقای بومی نسخه اندروید جهت جلوگیری از کرش پکیج مرورگر
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch InAppWebView Gradle Compatibility
        run: |
          find ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android -name build.gradle -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      - name: Build Optimized APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperLink-App-Optimized
          path: build/app/outputs/flutter-apk/*-release.apk
