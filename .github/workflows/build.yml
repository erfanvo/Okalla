Name: Build HyperLink APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean and Rebuild Android Platform
        run: |
          # ۱. حذف کامل هرگونه فایل اندرویدی قدیمی یا ری‌اکت نیتیو
          rm -rf android
          
          # ۲. اجبار فلاتر به ساخت مجدد و کامل پلتفرم اندروید
          flutter create --platforms=android --project-name hyperlink --org com.hyperlink.app .
          
          # ۳. ارتقای نسخه اندروید در تمامی فرمت‌های احتمالی (gradle و kts)
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle*
          sed -i 's/minSdkVersion 16/minSdkVersion 24/g' android/app/build.gradle*
          sed -i 's/minSdkVersion 19/minSdkVersion 24/g' android/app/build.gradle*
          sed -i 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle*
          
          # ۴. افزودن دسترسی اینترنت به صورت مستقیم
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      # این مرحله برای ساخت اتوماتیک آیکون اضافه شد
      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Patch InAppWebView Gradle Compatibility
        run: |
          # اصلاح خطای ناسازگاری پروگارد در کشِ کتابخانه
          find ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android -name build.gradle -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +

      - name: Build Optimized APK
        # خروجی گرفتن و تقسیم بر اساس پردازنده برای کاهش حجم
        run: flutter build apk --release --split-per-abi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperLink-App-Optimized
          path: build/app/outputs/flutter-apk/*-release.apk
