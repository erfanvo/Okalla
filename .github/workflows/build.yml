name: Build Nexus Link APK (Optimized & Signed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Persistent Release Signing Key
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Clean Unused Heavy Assets & Rebuild Android Platform
        run: |
          # حذف عکس‌های سنگین و بلااستفاده برای کاهش حجم APK
          rm -f assets/baran_link_icon.png assets/9w.jpg
          rm -rf android

          # ساخت مجدد پلتفرم اندروید
          flutter create --platforms=android --project-name nexus_link --org com.hyperlink.nexus .

          # پیکربندی دقیق Gradle، AndroidManifest و ProGuard با پایتون
          python3 - << 'EOF'
          import glob, pathlib, re

          # ۱. ارتقای minSdk به 21 (پشتیبانی از اندروید 5.0 تا اندروید 15/16)
          for path_str in glob.glob("android/app/build.gradle*"):
              p = pathlib.Path(path_str)
              txt = p.read_text(encoding="utf-8")
              txt = re.sub(r"flutter\.minSdkVersion", "21", txt)
              txt = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 21", txt)
              txt = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 21", txt)
              p.write_text(txt, encoding="utf-8")

          # ۲. بهینه‌سازی AndroidManifest.xml (رفع کرش کمبود رم، شتاب‌دهنده سخت‌افزاری و اینترنت)
          manifest_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
          manifest = manifest.replace('android:label="nexus_link"', 'android:label="Nexus Link"')
          if "android:largeHeap" not in manifest:
              manifest = manifest.replace(
                  "<application",
                  '<application\n        android:largeHeap="true"\n        android:hardwareAccelerated="true"\n        android:usesCleartextTraffic="true"',
                  1,
              )
          manifest_path.write_text(manifest, encoding="utf-8")

          # ۳. افزودن قوانین ProGuard برای جلوگیری از کرش وب‌ویو در حالت Release
          proguard_path = pathlib.Path("android/app/proguard-rules.pro")
          proguard_rules = """
          -keep class com.pichillilorenzo.flutter_inappwebview_android.** { *; }
          -keepclassmembers class com.pichillilorenzo.flutter_inappwebview_android.** { *; }
          -dontwarn com.pichillilorenzo.flutter_inappwebview_android.**
          """
          proguard_path.write_text(proguard_rules.strip() + "\n", encoding="utf-8")
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Patch InAppWebView Gradle Compatibility
        run: |
          find ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android -name build.gradle -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} + || true

      - name: Build Universal ARM APK (32-bit & 64-bit, Obfuscated)
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/debug-info
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NexusLink-Universal-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusLink-APK
          path: build/app/outputs/flutter-apk/NexusLink-Universal-Release.apk
